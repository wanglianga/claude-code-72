services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neighbor-kitchen:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    # 仅把应用服务端口发布到宿主，宿主端口取 CC_PUBLISH_PORT，内部固定 8080
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s
